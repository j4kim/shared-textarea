<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/@picocss/pico@latest/css/pico.classless.min.css"
    />
    <title>Shared Textarea</title>
  </head>
  <body>
    <main>
      <h1 style="text-align: center">Shared Textarea</h1>
      <textarea rows="10" id="textarea"></textarea>
    </main>
    <script>
      function update() {
        fetch('update.php', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/x-www-form-urlencoded',
          },
          body: 'text=' + encodeURIComponent(textarea.value),
        });
      }

      function set(text) {
        textarea.value = text;
      }

      textarea.oninput = update;
    </script>
  </body>
</html>
